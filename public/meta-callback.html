<!DOCTYPE html>
<html>
<head><title>Connecting Meta…</title>
<style>body{font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#F4F6F9;flex-direction:column;gap:12px;color:#374151;}
.spin{width:32px;height:32px;border:3px solid #E9EBF0;border-top-color:#1877F2;border-radius:50%;animation:s .8s linear infinite;}
@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="spin"></div>
<p style="font-size:14px;font-weight:500;">Connecting Meta Ads…</p>
<script>
  // Parse access token from URL hash
  const hash = window.location.hash.substring(1)
  const params = new URLSearchParams(hash)
  const token = params.get('access_token')
  if (token) {
    // Send token back to opener
    if (window.opener) {
      window.opener.postMessage({ type: 'META_TOKEN', token }, window.location.origin)
    } else {
      // Fallback: store and redirect
      localStorage.setItem('lq_meta_token', token)
      window.location.href = '/dashboard/meta-ads'
    }
  } else {
    document.body.innerHTML = '<p style="color:#DC2626">Auth failed. Close this window and try again.</p>'
  }
</script>
</body>
</html>
