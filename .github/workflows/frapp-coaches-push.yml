name: Frapp Coaches Push

# Keeps Futwork's call-routing list current automatically, on top of the
# manual "Push to Frapp" button on Team Mapping > Connectors (which keeps
# working exactly as before -- explicit instruction: "apart from manual
# button, it should work automatically"). Calls the exact same team_frapp_push
# mode buildFrappCoachList/frappPush in api/crm-leads.js already back, so a
# scheduled run and a manual click produce byte-identical eligibility/Country
# logic -- nothing new to keep in sync.
#
# Every 15 minutes -- explicit instruction: "keep it real-time... if someone
# removed from here, should be removed from there." True real-time isn't
# achievable regardless of mechanism: LeadSquared has no webhook, this app
# only ever POLLS its current state, so the fastest a removal/change can
# reach Frapp is bounded by how often we poll -- not by anything on our own
# side. 15 minutes is the shortest interval GitHub Actions' `schedule`
# trigger reliably honours (5-minute crons are documented to silently skip or
# lag under GitHub's own load, especially on public runners); *:dispatch is
# also here for an on-demand run from the Actions tab. The push itself is a
# full-list overwrite (see the panel's own note: a departed coach is simply
# absent from the next payload, no separate removal signal needed), so
# re-running it this often is always safe -- it can never "double push" or
# leave a stale partial state.
#
# "Sync coach directory" (the 6-8 minute full Virtual DID re-sweep, for the
# one edge case self-heal can't see -- someone switching teams while staying
# Active) stays manual on purpose -- not run here, deliberately out of scope
# for this automation.
#
# Requires the CRON_SECRET repository Actions secret (already used by every
# other scheduled sync/report in this repo) -- nothing new to configure.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

concurrency:
  group: frapp-coaches-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Push current coaches to Frapp
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X GET "https://quantum.leverageedu.com/api/crm-leads?source=leadsquared&mode=team_frapp_push" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "Failed with status $STATUS"; exit 1; fi
          echo "Frapp coaches push complete."
