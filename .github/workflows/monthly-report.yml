name: Monthly Meta Ads Report

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly report
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X POST "https://quantum.leverageedu.com/api/send-report" -H "Content-Type: application/json" -d '{"type":"monthly","triggered_by":"cron"}')
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "Failed with status $STATUS"; exit 1; fi
          if echo "$JSON" | grep -q '"skipped":true'; then
            echo "::warning::Monthly report SKIPPED — Automatic Reports is disabled in Settings"
          else
            echo "Monthly Meta Report sent!"
          fi
