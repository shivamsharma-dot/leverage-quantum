name: Daily Meta Campaign Report

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X POST "https://quantum.leverageedu.com/api/send-report" -H "Content-Type: application/json" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -d '{}')
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "Failed with status $STATUS"; exit 1; fi
          if echo "$JSON" | grep -q '"skipped":true'; then
            echo "::warning::Daily report SKIPPED — Automatic Reports is disabled in Settings"
          else
            echo "Meta Campaign Report sent successfully!"
          fi
