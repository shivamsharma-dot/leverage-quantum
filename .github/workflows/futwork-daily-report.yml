name: Futwork Daily Conversion Report (Slack DM)

# Sends the Futwork daily conversion report (yesterday + month to date by source, as a picture) as a Slack DM
# AS Shivam Sharma (SLACK_USER_TOKEN) into his DM with Sneha (Futwork is a Slack Connect org, bots cannot DM her). Built by lib/futworkDailyReport.mjs, endpoint type futwork_daily_report in
# api/send-report.mjs. DM: app_preferences.futwork_report_channel, else D0B4TF3H4N7.
#
# Intended for 11:00 AM IST every day, after the 9 AM and 10:10 AM Overall BigQuery syncs. If yesterday has
# no data yet the endpoint sends nothing and this run fails, so a missing report shows up as a red run.
#
# Triggered by cron-job.org -> workflow_dispatch (same as the other syncs). Needs the CRON_SECRET secret.
on:
  workflow_dispatch:

concurrency:
  group: futwork-daily-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send the report
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X POST "https://quantum.leverageedu.com/api/send-report" -H "Content-Type: application/json" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -d '{"type":"futwork_daily_report"}')
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "Failed with status $STATUS"; exit 1; fi
          if [ "$(echo "$JSON" | jq -r '.ok')" != "true" ]; then echo "ok is not true -- failing"; exit 1; fi
          echo "Sent to $(echo "$JSON" | jq -r '.sentTo')"
