name: Overall Funnel Cache Sync

# Used to request hourly via GitHub's own `schedule:` trigger, but that was never a
# real freshness guarantee: GitHub heavily throttles scheduled workflows on a
# low-activity repo, and observed run spacing was 2-3.5 hours (e.g. 18:49, 20:43,
# 22:18, 00:11, 03:37, 06:40 UTC on 2026-07-27/28) -- in practice indistinguishable
# from the once/twice-daily cadence every other dashboard sync in this repo already
# uses. Moved to cron-job.org -> workflow_dispatch instead (2026-09-12), retimed onto
# the same fixed 10:00 AM IST checkpoint Overall BQ sync's own second daily run
# already uses, per the user's own request to have every dashboard-updating sync land
# on a small, predictable set of shared times instead of scattered/unreliable ones.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, aggregate, and upsert the Overall PM funnel sheet
        env:
          SB_URL: https://tsyekthwthxszmsgqfej.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.parse, re, os, time, calendar
          from datetime import datetime, timezone, timedelta

          SB_URL = os.environ['SB_URL']
          SB_KEY = os.environ['SB_KEY']
          # Same sheet api/ask-ai.js and OverallDashboard.jsx read (the admin-configured
          # override, if any, is resolved by those two at request time -- this scheduled
          # sync intentionally uses the well-known default sheet directly, matching the
          # convention of every other sync/health-check workflow in this repo).
          SHEET_URL = 'https://docs.google.com/spreadsheets/d/1kaoWMGBbttOtaeVfaSXhrxcs0_pe5xLX1tMuIG8mHG4/gviz/tq?tqx=out:csv&sheet=MainData'

          MONTHS = {'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12}

          def split_csv_line(line):
              out, cur, q = [], '', False
              i = 0
              while i < len(line):
                  ch = line[i]
                  if q:
                      if ch == '"':
                          if i + 1 < len(line) and line[i+1] == '"':
                              cur += '"'; i += 1
                          else:
                              q = False
                      else:
                          cur += ch
                  else:
                      if ch == '"': q = True
                      elif ch == ',': out.append(cur); cur = ''
                      else: cur += ch
                  i += 1
              out.append(cur)
              return out

          def parse_date(s):
              s = (s or '').strip()
              m = re.match(r'^(\d{1,2})-([A-Za-z]{3})-(\d{4})$', s)
              if not m: return None
              mon = MONTHS.get(m.group(2).lower())
              if not mon: return None
              try:
                  return datetime(int(m.group(3)), mon, int(m.group(1))).strftime('%Y-%m-%d')
              except ValueError:
                  return None

          def num(v, is_float=False):
              s = re.sub(r'[^0-9.\-]' if is_float else r'[^0-9\-]', '', str(v or '0'))
              try:
                  return float(s) if is_float else int(s or 0)
              except ValueError:
                  return 0

          print('Fetching sheet...')
          req = urllib.request.Request(SHEET_URL, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r:
              text = r.read().decode('utf-8', errors='replace')
          lines = [l for l in text.split('\n') if l.strip()]
          if not lines or lines[0].strip().startswith('<'):
              raise SystemExit('Sheet fetch returned HTML instead of CSV -- aborting sync.')

          header = [h.strip().strip('"').lower() for h in split_csv_line(lines[0])]
          def idx(name):
              try: return header.index(name)
              except ValueError: return -1

          di, ci, si = idx('lead_date'), idx('campaign_name'), idx('source')
          # 'Queued on Futwork' was renamed to 'Queued on Futwork Human' and a new
          # 'Queued on Futwork AI' column was added on 2026-08-20 (the underlying
          # leads didn't move provider, only the label naming which Futwork channel
          # queued them -- see OverallDashboard.jsx's mapRow() for the same rename).
          # Before this fix, idx('queued on futwork') silently returned -1 once the
          # sheet header changed, so 'queued' undercounted by the entire Futwork
          # Human amount for every day since the sheet was renamed.
          #
          # C3 fix (2026-08-21): 'queued' here used to include floor_queued, while the
          # Overall dashboard's own 'Total Queued' KPI deliberately excludes it (Floor-
          # distributed leads never went through Futwork/Superbot qualification, so they
          # never had a chance to become a QL). That made this table -- and anything
          # reading it (Ask AI's analyze_campaign_contribution tool, the Marketing
          # Performance Report, scheduled agents) -- quote a QL% roughly half the
          # dashboard's for the same period (Jul'26: ~7.1% here vs ~15.5% on the
          # dashboard). Decision: match the dashboard, exclude floor_queued everywhere.
          # fq/idx('floor_queued') is kept below (still selected, just not summed into
          # 'queued') in case a future report wants to show Floor as its own figure.
          li, fq, qfh, qfa, qs = idx('total leads generated'), idx('floor_queued'), idx('queued on futwork human'), idx('queued on futwork ai'), idx('queued on superbot')
          hql, faq, saq, sp = idx('futwork human ql'), idx('futwork ai ql'), idx('superbot ai ql'), idx('total_spends')
          ap, of, de, ra = idx('total apps'), idx('total offers'), idx('total deposits'), idx('total raus')

          agg = {}
          for line in lines[1:]:
              cols = split_csv_line(line)
              if ci < 0 or ci >= len(cols): continue
              campaign = cols[ci].strip().strip('"')
              if not campaign: continue
              d = parse_date(cols[di].strip('"')) if 0 <= di < len(cols) else None
              if not d: continue
              source = (cols[si].strip().strip('"') if 0 <= si < len(cols) else '') or 'Unknown'
              key = (campaign, d, source)
              e = agg.get(key)
              if not e:
                  e = {'campaign': campaign, 'date': d, 'source': source, 'leads': 0, 'queued': 0, 'total_ql': 0, 'spend': 0.0, 'apps': 0, 'offers': 0, 'deposits': 0, 'raus': 0}
                  agg[key] = e
              g = lambda i: cols[i] if 0 <= i < len(cols) else '0'
              e['leads'] += num(g(li))
              e['queued'] += num(g(qfh)) + num(g(qfa)) + num(g(qs))  # excludes floor_queued -- see C3 note above
              e['total_ql'] += num(g(hql)) + num(g(faq)) + num(g(saq))
              e['spend'] += num(g(sp), True)
              e['apps'] += num(g(ap))
              e['offers'] += num(g(of))
              e['deposits'] += num(g(de))
              e['raus'] += num(g(ra))

          rows = list(agg.values())
          now_iso = datetime.utcnow().isoformat() + 'Z'
          for row in rows:
              row['synced_at'] = now_iso
          print('Aggregated', len(lines) - 1, 'raw rows into', len(rows), '(campaign, date, source) rows.')

          BATCH = 500
          for i in range(0, len(rows), BATCH):
              batch = rows[i:i+BATCH]
              req = urllib.request.Request(
                  SB_URL + '/rest/v1/overall_funnel_daily?on_conflict=campaign,date,source',
                  data=json.dumps(batch).encode('utf-8'),
                  method='POST',
                  headers={
                      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
                      'Content-Type': 'application/json',
                      'Prefer': 'resolution=merge-duplicates,return=minimal',
                  },
              )
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          r.read()
                      break
                  except Exception as e:
                      print('batch', i, 'attempt', attempt, 'failed:', e)
                      if attempt == 2: raise
                      time.sleep(2 * (attempt + 1))
              print('Upserted batch', i, '-', i + len(batch), 'of', len(rows))

          # ── Manual affiliate spend ──────────────────────────────────────────────
          # Affiliate spend is entered per month by an admin (Settings > Data > Affiliate
          # spend) and lives in app_preferences, NOT in the sheet. Without this step every
          # consumer of this cache -- the Marketing Performance report, both agents, and
          # Ask AI's analyze_campaign_contribution tool -- sees Affiliate at zero spend and
          # treats its CPQL/CPA as free, which skews per-channel comparisons.
          #
          # This mirrors buildSyntheticAffiliateRows() in src/pages/OverallDashboard.jsx:
          # each month is spread across one row PER DAY, with the denominator matching what
          # the entered figure actually means --
          #   past month    = completed total    -> divided by that month's calendar days
          #   current month = spend-so-far       -> divided by days elapsed, nothing after today
          #   future month  = pre-entered budget -> divided by the full calendar month
          # Elapsed days are counted in IST so this agrees with what the team sees in the
          # browser rather than drifting by a day on a UTC runner.
          # KEEP THE TWO IMPLEMENTATIONS IN STEP if either changes.
          AFF_CAMPAIGN = 'Affiliate (manual entry)'
          try:
              IST = timezone(timedelta(hours=5, minutes=30))
              now_ist = datetime.now(IST)
              cur_y, cur_m, cur_d = now_ist.year, now_ist.month, now_ist.day

              pref_url = (SB_URL + '/rest/v1/app_preferences?select=value'
                          '&key=eq.affiliate_spend_manual&limit=1')
              req = urllib.request.Request(pref_url, headers={
                  'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  pref = json.loads(r.read().decode('utf-8'))
              aff_map = {}
              if pref and isinstance(pref[0].get('value'), dict):
                  aff_map = pref[0]['value']

              aff_rows = []
              for ym, raw in sorted(aff_map.items()):
                  m_ym = re.match(r'^(\d{4})-(\d{1,2})$', str(ym).strip())
                  if not m_ym: continue
                  y, mo = int(m_ym.group(1)), int(m_ym.group(2))
                  if mo < 1 or mo > 12: continue
                  total = num(raw, True)
                  if not total: continue
                  days_in_month = calendar.monthrange(y, mo)[1]
                  is_current = (y == cur_y and mo == cur_m)
                  days = min(cur_d, days_in_month) if is_current else days_in_month
                  if days <= 0: continue
                  per_day = total / days
                  for d in range(1, days + 1):
                      aff_rows.append({
                          'campaign': AFF_CAMPAIGN, 'source': 'Affiliate',
                          'date': '%04d-%02d-%02d' % (y, mo, d),
                          'leads': 0, 'queued': 0, 'total_ql': 0, 'spend': per_day,
                          'apps': 0, 'offers': 0, 'deposits': 0, 'raus': 0,
                          'synced_at': now_iso,
                      })
                  print('  %s: %s over %d day(s) -> %.2f/day%s'
                        % (ym, total, days, per_day, ' (spend-so-far)' if is_current else ''))

              # Delete before insert, so reducing or removing a month's entry self-corrects
              # instead of leaving stale prorated days behind. Scoped to our own synthetic
              # campaign label, so real sheet rows are never touched.
              #
              # The value is percent-encoded and NOT wrapped in double quotes: PostgREST
              # treats those quotes as literal characters in the value, so `eq."Affiliate
              # (manual entry)"` silently matches ZERO rows while `eq.Affiliate%20%28manual
              # %20entry%29` matches all of them -- verified live against the real table.
              # Quoting it made this delete a no-op, which defeated the whole point.
              del_url = (SB_URL + '/rest/v1/overall_funnel_daily?campaign=eq.'
                         + urllib.parse.quote(AFF_CAMPAIGN))
              req = urllib.request.Request(del_url, method='DELETE', headers={
                  'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
                  'Prefer': 'return=minimal',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  r.read()

              for i in range(0, len(aff_rows), BATCH):
                  batch = aff_rows[i:i+BATCH]
                  req = urllib.request.Request(
                      SB_URL + '/rest/v1/overall_funnel_daily?on_conflict=campaign,date,source',
                      data=json.dumps(batch).encode('utf-8'),
                      method='POST',
                      headers={
                          'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
                          'Content-Type': 'application/json',
                          'Prefer': 'resolution=merge-duplicates,return=minimal',
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()
              print('Affiliate spend: wrote', len(aff_rows), 'prorated day rows across',
                    len(aff_map), 'month(s).')
          except Exception as e:
              # Non-fatal on purpose -- the sheet aggregation above is the important payload,
              # and it has already been written by this point. The response body is included
              # because a bare HTTPError stringifies to just "HTTP Error 400: Bad Request",
              # which is useless for diagnosing a PostgREST rejection after the fact.
              detail = ''
              try:
                  if hasattr(e, 'read'): detail = ' | body: ' + e.read().decode('utf-8')[:500]
              except Exception:
                  pass
              print('::warning::manual affiliate spend sync skipped:', repr(e) + detail)

          print('Sync complete.')
          PYEOF
