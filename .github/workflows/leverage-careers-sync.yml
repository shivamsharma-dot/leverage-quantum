name: Leverage Careers BigQuery Cache Sync

# Refreshes public.leverage_careers_daily (see
# supabase/sql/leverage_careers_daily_setup.sql) by calling the existing
# careers_sync mode on api/crm-leads.js -- that endpoint already owns the
# BigQuery query (careersLeadsSql), the Supabase upsert, and the prune step,
# so this workflow is just the scheduled trigger. It also means every run
# lands in bigquery_jobs automatically (lib/bigquery.mjs's bigQuerySelect
# logs every call it makes), so Settings > Data > BigQuery Usage reflects
# this sync the same way it reflects any other BigQuery call.
#
# Why 3x/day, not hourly: the underlying LeadSquared export into BigQuery
# only actually refreshes 3x/day (~9:30am, 2pm, 9pm IST). Syncing more often
# than the source data changes would just re-run the same ~11.5GB full-table
# scan (this table isn't partitioned in a way the query can prune -- see the
# comment on careersLeadsSql in api/crm-leads.js) for identical results --
# exactly the pattern that produced the Aug 2026 BigQuery cost spikes this
# cache exists to fix.
#
# Requires the CRON_SECRET repository Actions secret (already used by the
# daily/weekly/monthly report workflows) and the BIGQUERY_*/SUPABASE_* env
# vars already set in Vercel -- nothing new to configure there.
#
# Triggered by cron-job.org -> workflow_dispatch (2026-09-12) -- NOT GitHub's
# own `schedule:` trigger, which this repo has repeatedly found fires
# unpredictably on a low-activity repo. Retimed onto the same fixed daily
# checkpoints every other dashboard-updating sync now uses, per the user's
# own request: 9:30 AM (was 9:45 -- merges into the same slot Monthly QLs and
# Apps sync already use, since 9:30 is genuinely when this source data
# refreshes anyway), 2:00 PM (was 2:15), 10:00 PM (was 9:30 PM -- merges into
# Overall BQ sync's own existing 10 PM slot instead of sitting 30 minutes
# apart from it for no reason).
# 2026-10-27: now ONE run a day, 9:30 AM IST. The 2 PM and 10 PM cron-job.org
# jobs were switched off (still listed, Inactive) at the owner's request; the
# 3x/day reasoning above no longer applies.
on:
  workflow_dispatch:

concurrency:
  group: leverage-careers-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger the Leverage Careers cache sync
        run: |
          # A 0-row BigQuery read (transient upstream blip, seen 2026-10-26 2pm and
          # 2026-10-27 9:30am) returns HTTP 200 but writes nothing, so the page
          # silently stays on old data. Retry a few times, a few minutes apart,
          # and fail the run if it never gets rows.
          for ATTEMPT in 1 2 3 4; do
            BODY=$(curl -s -m 120 -w "\n%{http_code}" -X GET "https://quantum.leverageedu.com/api/crm-leads?source=bigquery&mode=careers_sync" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
            STATUS=$(echo "$BODY" | tail -n1)
            JSON=$(echo "$BODY" | sed '$d')
            echo "Attempt $ATTEMPT HTTP Status: $STATUS"
            echo "Response: $JSON"
            ROWS=$(echo "$JSON" | jq -r '.rowCount // 0' 2>/dev/null || echo 0)
            if [ "$STATUS" = "200" ] && [ "$ROWS" -gt 0 ]; then
              echo "Leverage Careers cache synced ($ROWS rows)."
              exit 0
            fi
            [ "$ATTEMPT" -lt 4 ] && sleep 180
          done
          echo "::error::Leverage Careers sync got no rows or failed after 4 attempts"
          exit 1
