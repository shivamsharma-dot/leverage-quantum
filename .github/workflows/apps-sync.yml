name: Apps BigQuery Cache Sync

# Refreshes public.apps_feed (see supabase/sql/apps_feed_setup.sql) by calling
# the apps_sync mode on api/crm-leads.js -- that endpoint owns the BigQuery
# query (APPS_SQL, mirroring Settings > Data > BigQuery Console's "appv2"
# saved query, minus one unused join that risked duplicate rows -- see the
# comment on APPS_SQL itself), the Supabase upsert, and the prune step, so
# this workflow is just the scheduled trigger. Every run lands in
# bigquery_jobs automatically the same way any other BigQuery call does.
#
# Once/day only, per explicit instruction ("no real time refresh") -- not
# 3x/day like Leverage Careers.
#
# Requires the CRON_SECRET repository Actions secret (already used by the
# report workflows and the Leverage Careers sync) and the BIGQUERY_*/
# SUPABASE_* env vars already set in Vercel -- nothing new to configure there.
#
# Triggered by cron-job.org -> workflow_dispatch, 9:30 AM IST (2026-09-12) --
# NOT GitHub's own `schedule:` trigger, which this repo has repeatedly found
# fires unpredictably on a low-activity repo (silently dropped runs, multi-
# hour delays -- see overall-bq-sync.yml's and overall-funnel-sync.yml's own
# history). 9:30 sits right after Overall BQ sync's own 9:00 run and
# alongside Monthly QLs sync, per the user's own request to have every
# dashboard-updating sync land on the same handful of fixed daily checkpoints
# (9:00 / 9:30 / 10:00 / 10:30 IST) instead of scattered, unreliable times.
on:
  workflow_dispatch:

concurrency:
  group: apps-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the Apps cache sync
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X GET "https://quantum.leverageedu.com/api/crm-leads?source=bigquery&mode=apps_sync" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "Failed with status $STATUS"; exit 1; fi
          echo "Apps cache synced."
