name: Quantum Gazette Agent

on:
  schedule:
    # 9:00 PM IST daily (15:30 UTC) -- "Printed Nightly", same cron-secret-gated
    # pattern as the other scheduled agents/reports. Regenerates fresh markdown
    # + a fresh gazette_html snapshot every run -- see the isGazette branch in
    # api/ask-ai.mjs's handleAgentRun for what actually gets saved.
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Quantum Gazette Agent
        run: |
          BODY=$(curl -s -w "\n%{http_code}" -X POST "https://quantum.leverageedu.com/api/ask-ai" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"mode":"agent_run","agent_id":"quantum_gazette","triggered_by":"cron"}')
          STATUS=$(echo "$BODY" | tail -n1)
          JSON=$(echo "$BODY" | sed '$d')
          echo "HTTP Status: $STATUS"
          echo "Response: $JSON"
          if [ "$STATUS" != "200" ]; then echo "::error::Agent run failed with status $STATUS"; exit 1; fi
          echo "Quantum Gazette Agent ran successfully."
