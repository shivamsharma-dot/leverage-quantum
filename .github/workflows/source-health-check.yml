name: Data Source Health Check

on:
  # Disabled 2026-08 -- the "Automated checks" UI that showed these results (and let
  # an admin set the schedule) was removed from Settings > Data ("no one checks
  # connections health daily"). "Check all sources" in Settings still runs the same
  # checks on demand. Kept as workflow_dispatch only, not deleted, in case this is
  # ever wanted again -- trigger manually from the Actions tab if so.
  workflow_dispatch:

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check all sheet sources and record health
        env:
          SB_URL: https://tsyekthwthxszmsgqfej.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, urllib.parse, os, re
          from datetime import datetime, timedelta

          SB_URL = os.environ['SB_URL']
          SB_KEY = os.environ['SB_KEY']
          BASE = 'https://docs.google.com/spreadsheets/d/1r-e6pBCN5ysfeD3Eq6sxgLmf97mdeTtloMPylqnx6Ew/gviz/tq?tqx=out:csv&sheet='

          SOURCES = [
              {'name': 'Referral Sheet', 'sheet': 'Referral', 'date_col': 'created_at'},
              {'name': 'QL Ops Sheet (Daily)', 'sheet': 'Qlops', 'date_col': 'qualified_date'},
              {'name': 'QL Snapshot Sheet (Monthly)', 'sheet': 'QLSnapshot', 'date_col': None},
              {'name': 'WhatsApp Sheet', 'sheet': 'whatsapp', 'date_col': None},
              {'name': 'FB Leads / CRM Sheet', 'sheet': 'FBleads', 'date_col': 'lead_created_date'},
              {'name': 'Leads Assigned Sheet', 'sheet': 'Leadassigned', 'date_col': None},
              {'name': 'Google Ads CRM Leads Sheet', 'sheet': 'googleleads', 'date_col': 'lead_created_date'},
          ]

          MONTHS = {'jan':1,'feb':2,'mar':3,'apr':4,'may':5,'jun':6,'jul':7,'aug':8,'sep':9,'oct':10,'nov':11,'dec':12}

          def split_csv_line(line):
              out, cur, q = [], '', False
              i = 0
              while i < len(line):
                  ch = line[i]
                  if q:
                      if ch == '"':
                          if i + 1 < len(line) and line[i+1] == '"':
                              cur += '"'; i += 1
                          else:
                              q = False
                      else:
                          cur += ch
                  else:
                      if ch == '"': q = True
                      elif ch == ',': out.append(cur); cur = ''
                      else: cur += ch
                  i += 1
              out.append(cur)
              return out

          def parse_date(s):
              s = (s or '').strip()
              m = re.match(r'^(\d{1,2})-([A-Za-z]{3})-(\d{4})$', s)
              if m:
                  mon = MONTHS.get(m.group(2).lower())
                  if mon: return datetime(int(m.group(3)), mon, int(m.group(1)))
                  return None
              m = re.match(r'^(\d{4})-(\d{2})-(\d{2})', s)
              if m: return datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)))
              m = re.match(r'^(\d{1,2})/(\d{1,2})/(\d{4})$', s)
              if m:
                  try: return datetime(int(m.group(3)), int(m.group(1)), int(m.group(2)))
                  except ValueError: return None
              return None

          def sb_get(path):
              req = urllib.request.Request(SB_URL + '/rest/v1/' + path, headers={'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))

          def sb_upsert(row):
              req = urllib.request.Request(
                  SB_URL + '/rest/v1/source_health',
                  data=json.dumps(row).encode('utf-8'),
                  method='POST',
                  headers={
                      'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
                      'Content-Type': 'application/json',
                      'Prefer': 'resolution=merge-duplicates',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  r.read()

          def log_activity(detail):
              row = {'email': 'system', 'action': 'source_health_warning', 'page': 'Settings', 'detail': detail[:240]}
              req = urllib.request.Request(
                  SB_URL + '/rest/v1/activity_log',
                  data=json.dumps(row).encode('utf-8'), method='POST',
                  headers={'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      r.read()
              except Exception as e:
                  print('activity_log write failed:', e)

          # Schedule is configurable from Settings > Data Sources (stored in app_preferences,
          # key 'source_health_schedule', e.g. {"mode":"daily","hour":9} for 9 AM IST,
          # {"mode":"hourly"}, or {"mode":"off"}). Manual "Run workflow" always runs regardless.
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              schedule = {'mode': 'daily', 'hour': 9}
              try:
                  rows = sb_get('app_preferences?select=value&key=eq.source_health_schedule&limit=1')
                  if rows and rows[0].get('value'):
                      schedule = rows[0]['value']
              except Exception as e:
                  print('could not read schedule preference, using default:', e)

              mode = schedule.get('mode', 'daily')
              now_ist = datetime.utcnow() + timedelta(hours=5, minutes=30)
              proceed = mode == 'hourly' or (mode == 'daily' and now_ist.hour == int(schedule.get('hour', 9)))
              if not proceed:
                  print('Skipping this run -- schedule is', schedule, '/ IST now:', now_ist.strftime('%H:%M'))
                  raise SystemExit(0)

          for src in SOURCES:
              name = src['name']
              status, message = 'ok', ''
              row_count = 0
              distinct_dates = 0
              first_date = None
              last_date = None
              try:
                  url = BASE + src['sheet']
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode('utf-8', errors='replace')
                  lines = [l for l in text.split('\n') if l.strip()]
                  if not lines or lines[0].strip().startswith('<'):
                      raise ValueError('got HTML instead of CSV (sheet may not be shared publicly)')
                  header = [h.strip().strip('"').lower() for h in split_csv_line(lines[0])]
                  row_count = len(lines) - 1
                  if src['date_col']:
                      try:
                          idx = header.index(src['date_col'])
                          dates = set()
                          mind = maxd = None
                          for line in lines[1:]:
                              cols = split_csv_line(line)
                              if idx >= len(cols): continue
                              d = parse_date(cols[idx])
                              if not d: continue
                              dates.add((d.year, d.month))
                              if mind is None or d < mind: mind = d
                              if maxd is None or d > maxd: maxd = d
                          distinct_dates = len(dates)
                          first_date = mind.strftime('%Y-%m-%d') if mind else None
                          last_date = maxd.strftime('%Y-%m-%d') if maxd else None
                      except ValueError:
                          pass

                  prev_rows = sb_get('source_health?select=*&name=eq.' + urllib.parse.quote(name) + '&limit=1')
                  prev = prev_rows[0] if prev_rows else None

                  if prev:
                      prev_dd = prev.get('distinct_dates') or 0
                      prev_rc = prev.get('row_count') or 0
                      if src['date_col'] and prev_dd > 1 and distinct_dates <= 1:
                          status = 'warn'
                          message = 'Date coverage narrowed from ' + str(prev_dd) + ' months to ' + str(distinct_dates) + ' -- check for an active Filter on the sheet tab.'
                      elif prev_rc > 20 and row_count < prev_rc * 0.5:
                          status = 'warn'
                          message = 'Row count dropped from ' + str(prev_rc) + ' to ' + str(row_count) + ' (>50% decrease).'
              except Exception as e:
                  status = 'error'
                  message = str(e)[:200]

              print(name, status, row_count, distinct_dates, first_date, last_date, message)
              try:
                  sb_upsert({
                      'name': name, 'row_count': row_count, 'distinct_dates': distinct_dates,
                      'first_date': first_date, 'last_date': last_date,
                      'status': status, 'message': message,
                      'checked_at': datetime.utcnow().isoformat() + 'Z',
                  })
              except Exception as e:
                  print('upsert failed for', name, e)

              if status in ('warn', 'error'):
                  log_activity(name + ': ' + (message or status))
          PYEOF
